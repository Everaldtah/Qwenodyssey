# Sample Qwenodyssey config. Copy to <your-project>/.qwenodyssey/config.toml
# (or run `qwenodyssey init`) and adjust.

[model]
provider = "ollama"            # ollama | lmstudio | openai | vllm | llamacpp | nvidia
model = "qwen2.5-coder:7b"
base_url = "http://localhost:11434"
api_key = ""                    # or set env QWENODYSSEY_API_KEY
temperature = 0.2
top_p = 0.9
max_tokens = 4096
context_tokens = 8192           # total context window of the model
# Ordered fallback chain. Bare tag = Ollama; "lmstudio:<key>" = LM Studio;
# "nvidia:<model>" = NVIDIA NIM cloud (only used when an NVIDIA key is set).
fallback_models = ["nvidia:moonshotai/kimi-k2.6", "deepseek-r1:7b"]

# NVIDIA NIM cloud endpoint (OpenAI-compatible). Use a strong hosted model such as
# moonshotai/kimi-k2.6 as the primary brain (provider = "nvidia", model = "...")
# or just as a fallback (above). The API key is a SECRET — DO NOT commit it here.
# Leave api_key blank and set the NVIDIA_API_KEY environment variable instead.
[nvidia]
enabled = true
base_url = "https://integrate.api.nvidia.com"
api_key = ""                    # leave blank; set env NVIDIA_API_KEY
api_key_env = "NVIDIA_API_KEY"
include_as_fallback = true
# Thinking models on NIM (kimi-k2.6, deepseek-v4-*, *-r1) degenerate into
# repetition / leak raw chain-of-thought into the answer. Send
# chat_template_kwargs.thinking=false for them to get clean, stable output.
disable_thinking = true
# Abort a NIM request after this many ms so a stalled hosted model (e.g.
# deepseek-v4-pro can hang) fails over to the next model in fallback_models.
request_timeout_ms = 90000
# Nemotron reasoning models use a different toggle (chat_template_kwargs.enable_thinking)
# + a reasoning_budget, and return their CoT in a separate reasoning_content field
# (which Qwenodyssey drops, so answers stay clean). Reasoning on by default.
nemotron_thinking = true
reasoning_budget = 4096
# Reliable picks on NIM: nvidia/nemotron-3-ultra-550b-a55b (reasoning, tools, fast),
# qwen/qwen3-coder-480b-a35b-instruct (coding, fast), meta/llama-3.3-70b-instruct.
# deepseek-ai/deepseek-v4-pro is strong but can stall; moonshotai/kimi-k2.6 is
# unstable with rich prompts.

[agent]
max_retries = 4
auto_apply = false              # apply edits without asking (use with care)
auto_test = true
review_before_apply = true
small_model_mode = true         # default to --safe, terse prompts, tight context
edit_protocol = "blocks"        # "blocks" = SEARCH/REPLACE (reliable for small models) | "json"
candidates = 2                  # best-of-N edit samples; pick the one that applies/compiles (1 disables)
verify_after_edit = true        # run typecheck/lint/test after edits and self-repair from the output
prebuild_symbol_index = true    # warm the code-navigation index at startup

[tools]
allow_shell = true
confirm_destructive = true
sandbox = true

[memory]
enabled = true
path = ".qwenodyssey/memory"

# ── Live voice + vision: `qwenodyssey live` (needs ffmpeg + whisper.cpp; vision
# via Ollama or NIM; TTS via Piper or Windows SAPI). ──
[vision]
enabled = true
provider = "ollama"             # ollama (local) | nvidia | openai
model = "moondream"             # local: moondream / llava:7b / qwen2.5vl ; NIM: nvidia/nemotron-nano-12b-v2-vl
device = ""                     # "" = auto-detect first webcam
confirm = true                  # ask before each capture (chat `look`); live mode ignores this

[audio]
enabled = true
device = ""                     # "" = auto-detect mic
whisper_bin = ""                # "" = auto (whisper-cli on PATH)
whisper_model = ""              # "" = ~/.qwenodyssey/models/ggml-base.en.bin
max_seconds = 30
language = "en"
vad_threshold = 0.6             # continuous-listening sensitivity (whisper-stream)

[tts]
enabled = true
engine = "piper"                # piper (local neural) | sapi (Windows built-in) | none
piper_bin = ""                  # "" = ~/.qwenodyssey/piper/piper/piper.exe
piper_voice = ""                # "" = ~/.qwenodyssey/piper/voices/en_US-amy-medium.onnx

# Omni mode: one multimodal model hears + sees + reasons in a single call (audio
# and frames go to the cloud). When false, `live` uses the local whisper+vision split.
[omni]
enabled = false
model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"   # audio+vision+reasoning; or microsoft/phi-4-multimodal-instruct
provider = "nvidia"
send_image = true
